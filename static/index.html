<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PitCrew</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="manifest" href="/static/manifest.json" />
    <meta name="theme-color" content="#151414" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PitCrew" />
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
</head>

<body>

    <!-- GARAGE VIEW -->
    <div id="view-garage" class="view active">
        <header class="app-header">
            <span class="logo">Pit<em>Crew</em></span>
        </header>
        <main>
            <div class="section-heading">Your Garage <span id="car-count"></span></div>
            <div class="car-grid" id="car-grid"></div>
        </main>
    </div>

    <!-- CAR VIEW -->
    <div id="view-car" class="view">
        <header class="app-header">
            <span class="logo">Pit<em>Crew</em></span>
        </header>
        <div class="car-subheader">
            <button class="back-btn">Garage</button>
            <div class="header-right">
                <strong id="header-car-name"></strong>
                <span id="header-car-spec"></span>
            </div>
        </div>

        <div class="car-layout">

            <!-- SIDEBAR NAV -->
            <nav class="car-sidebar">
                <div class="car-sidebar-header">
                    <h2 id="sidebar-car-name"></h2>
                    <p id="sidebar-car-spec"></p>
                </div>
                <div class="car-nav-item active" data-section="section-info">
                    <span class="nav-label">Car Info</span>
                </div>
                <div class="car-nav-item" data-section="section-journal" data-load="journal">
                    <span class="nav-label">Journal</span>
                </div>
                <div class="car-nav-item" data-section="section-pins" data-load="views">
                    <span class="nav-label">Photo Pins</span>
                </div>
                <div class="car-nav-item" data-section="section-cart" data-load="cart">
                    <span class="nav-label">Cart</span>
                </div>
                <div class="car-nav-item" data-section="section-manual" data-load="manuals">
                    <span class="nav-label">Documents</span>
                </div>
            </nav>

            <!-- MAIN CONTENT AREA -->
            <div class="car-content">

                <!-- CAR INFO -->
                <div class="car-section active" id="section-info">
                    <div class="car-section-heading">Car Info</div>

                    <div class="car-photo-wrap">
                        <div class="car-photo-frame" id="photo-frame">
                            <div class="car-photo-placeholder" id="photo-placeholder">No photo</div>
                            <img id="car-photo-img" src="" alt="" style="display:none" />
                            <button class="car-photo-delete" id="photo-delete-btn" style="display:none" title="Delete photo">
                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="4" y1="4" x2="20" y2="20" />
                                    <line x1="20" y1="4" x2="4" y2="20" />
                                </svg>
                            </button>
                        </div>
                        <input type="file" id="photo-input" class="car-photo-input" accept="image/*" />
                    </div>

                    <form id="form-car-info">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Year</label>
                                <input type="number" id="info-year" placeholder="20xx" />
                            </div>
                            <div class="form-group">
                                <label>Make</label>
                                <input type="text" id="info-make" placeholder="Make" />
                            </div>
                            <div class="form-group">
                                <label>Model</label>
                                <input type="text" id="info-model" placeholder="Model" />
                            </div>
                            <div class="form-group">
                                <label>Trim</label>
                                <input type="text" id="info-trim" placeholder="Trim" />
                            </div>
                            <div class="form-group">
                                <label>Options</label>
                                <input type="text" id="info-options" placeholder="Options" />
                            </div>
                            <div class="form-group">
                                <label>Engine</label>
                                <input type="text" id="info-engine" placeholder="Engine" />
                            </div>
                            <div class="form-group">
                                <label>Colour : Paint Code</label>
                                <input type="text" id="info-color" placeholder="Colour : Paint Code" />
                            </div>
                            <div class="form-group">
                                <label>VIN</label>
                                <input type="text" id="info-vin" placeholder="VIN" />
                            </div>
                            <div class="form-group full">
                                <label>Notes</label>
                                <textarea id="info-notes" placeholder="Anything useful about this car"></textarea>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Save</button>
                        </div>
                    </form>
                </div>

                <!-- JOURNAL -->
                <div class="car-section" id="section-journal">
                    <div class="car-section-heading">Journal</div>

                    <div class="section-tabs">
                        <button class="section-tab active" data-tab="research">Research</button>
                        <button class="section-tab" data-tab="converse">Converse</button>
                        <button class="section-tab" data-tab="note">Note</button>
                        <button class="section-tab" data-tab="service">Service Log</button>
                        <button class="section-tab" data-tab="photo">Photos</button>
                        <button class="section-tab" data-tab="docsearch">Doc Searches</button>
                    </div>

                    <div class="section-tab-content active" id="journal-research">
                        <div class="journal-add-form">
                            <input type="text" id="research-input" placeholder="Search for..." />
                            <button class="btn btn-primary" id="research-btn">Search</button>
                        </div>
                        <table class="parts-table">
                            <thead><tr><th>Date</th><th>Query</th><th></th></tr></thead>
                            <tbody id="research-tbody"></tbody>
                        </table>
                    </div>

                    <div class="section-tab-content" id="journal-converse">
                        <div class="journal-add-form">
                            <input type="text" id="converse-input" placeholder="Search for..." />
                            <button class="btn btn-primary">Converse</button>
                        </div>
                        <table class="parts-table">
                            <thead><tr><th>Date</th><th>Topic</th><th></th></tr></thead>
                            <tbody id="converse-tbody"></tbody>
                        </table>
                    </div>

                    <div class="section-tab-content" id="journal-note">
                        <div class="journal-add-form journal-add-form--col">
                            <textarea id="note-input" rows="3" placeholder="Write a note"></textarea>
                            <button class="btn btn-primary">Save Note</button>
                        </div>
                        <table class="parts-table">
                            <thead><tr><th>Date</th><th>Note</th><th></th></tr></thead>
                            <tbody id="note-tbody"></tbody>
                        </table>
                    </div>

                    <div class="section-tab-content" id="journal-service">
                        <div class="journal-add-form journal-add-form--col">
                            <input type="text" id="service-title-input" placeholder="Work done (e.g. Oil + filter change)" />
                            <textarea id="service-notes-input" rows="2" placeholder="Details — parts used, torque values, next due..."></textarea>
                            <div style="display:flex;gap:8px">
                                <input type="number" id="service-odo-input" placeholder="Odometer (km)" min="0" style="flex:1" />
                                <button class="btn btn-primary" id="service-add-btn">Log Service</button>
                            </div>
                        </div>
                        <table class="parts-table">
                            <thead><tr><th>Date</th><th>Odometer</th><th>Work</th><th></th></tr></thead>
                            <tbody id="service-tbody"></tbody>
                        </table>
                    </div>

                    <div class="section-tab-content" id="journal-photo">
                        <div class="journal-photo-upload">
                            <button class="btn btn-primary" id="photo-snap-btn">Add Photo</button>
                            <input type="file" id="journal-photo-input" accept="image/*" style="display:none" />
                        </div>
                        <div id="journal-photo-grid"></div>
                    </div>

                    <div class="section-tab-content" id="journal-docsearch">
                        <table class="parts-table">
                            <thead><tr><th>Date</th><th>Question</th><th></th></tr></thead>
                            <tbody id="docsearch-tbody"></tbody>
                        </table>
                    </div>
                </div>

                <!-- PHOTO PINS -->
                <div class="car-section" id="section-pins">
                    <div class="car-section-heading">Photo Pins</div>
                    <div class="section-tabs">
                        <button class="section-tab active" data-tab="front">Front</button>
                        <button class="section-tab" data-tab="sideD">Driver Side</button>
                        <button class="section-tab" data-tab="sideP">Passenger Side</button>
                        <button class="section-tab" data-tab="rear">Rear</button>
                        <button class="section-tab" data-tab="engine">Engine Bay</button>
                        <button class="section-tab" data-tab="underside">Underside</button>
                        <button class="section-tab" data-tab="interior">Interior</button>
                    </div>

                    <div class="section-tab-content active" id="photo-front">
                        <div class="view-grid" id="view-grid-front"></div>
                        <input type="file" id="view-input-front" accept="image/*" multiple style="display:none" />
                    </div>
                    <div class="section-tab-content" id="photo-sideD">
                        <div class="view-grid" id="view-grid-sideD"></div>
                        <input type="file" id="view-input-sideD" accept="image/*" multiple style="display:none" />
                    </div>
                    <div class="section-tab-content" id="photo-sideP">
                        <div class="view-grid" id="view-grid-sideP"></div>
                        <input type="file" id="view-input-sideP" accept="image/*" multiple style="display:none" />
                    </div>
                    <div class="section-tab-content" id="photo-rear">
                        <div class="view-grid" id="view-grid-rear"></div>
                        <input type="file" id="view-input-rear" accept="image/*" multiple style="display:none" />
                    </div>
                    <div class="section-tab-content" id="photo-engine">
                        <div class="view-grid" id="view-grid-engine"></div>
                        <input type="file" id="view-input-engine" accept="image/*" multiple style="display:none" />
                    </div>
                    <div class="section-tab-content" id="photo-underside">
                        <div class="view-grid" id="view-grid-underside"></div>
                        <input type="file" id="view-input-underside" accept="image/*" multiple style="display:none" />
                    </div>
                    <div class="section-tab-content" id="photo-interior">
                        <div class="view-grid" id="view-grid-interior"></div>
                        <input type="file" id="view-input-interior" accept="image/*" multiple style="display:none" />
                    </div>
                </div>

                <!-- CART -->
                <div class="car-section" id="section-cart">
                    <div class="car-section-heading">Cart</div>
                    <div class="section-tabs">
                        <button class="section-tab active" data-tab="all">All</button>
                        <button class="section-tab" data-tab="Mechanical">Mechanical</button>
                        <button class="section-tab" data-tab="Electrical">Electrical</button>
                        <button class="section-tab" data-tab="Body">Body</button>
                        <button class="section-tab" data-tab="Interior">Interior</button>
                        <button class="section-tab" data-tab="Consumables">Consumables</button>
                    </div>
                    <div id="cart-parts-list"></div>
                </div>

                <!-- DOCUMENTS -->
                <div class="car-section" id="section-manual">
                    <div class="car-section-heading">Documents</div>
                    <div class="journal-add-form" style="margin-bottom:16px">
                        <input type="text" id="doc-ask-input" placeholder="Search for..." />
                        <button class="btn btn-primary" id="doc-ask-btn" disabled>Ask AI</button>
                    </div>
                    <div id="doc-ask-result" style="display:none;margin-bottom:20px">
                        <div class="research-answer" id="doc-ask-answer"></div>
                        <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
                            <span style="font-size:11px;color:var(--muted)">Saved to Journal → Doc Searches</span>
                            <button class="btn btn-ghost" id="doc-ask-close-btn">Close</button>
                        </div>
                    </div>
                    <div class="section-tabs">
                        <button class="section-tab active" data-tab="manual">Manuals</button>
                        <button class="section-tab" data-tab="reference">Reference</button>
                        <button class="section-tab" data-tab="other">Other</button>
                    </div>
                    <div class="section-tab-content active" id="manual-tab-manual">
                        <div class="manual-grid" id="manual-grid-manual"></div>
                        <input type="file" id="manual-file-input-manual" accept=".pdf,.docx,.doc" style="display:none" multiple />
                    </div>
                    <div class="section-tab-content" id="manual-tab-reference">
                        <div class="manual-grid" id="manual-grid-reference"></div>
                        <input type="file" id="manual-file-input-reference" accept=".jpg,.jpeg,.png,.webp,.gif,.svg,.bmp" style="display:none" multiple />
                    </div>
                    <div class="section-tab-content" id="manual-tab-other">
                        <div class="manual-grid" id="manual-grid-other"></div>
                        <input type="file" id="manual-file-input-other" style="display:none" multiple />
                    </div>
                </div>

            </div><!-- end .car-content -->
        </div><!-- end .car-layout -->
    </div>

    <!-- ADD PART MODAL -->
    <div class="modal-overlay" id="modal-add-part">
        <div class="modal">
            <h3>Add Part</h3>
            <form id="form-add-part">
                <div class="form-grid">
                    <div class="form-group full">
                        <label>Name <span style="color:var(--muted)">*</span></label>
                        <input type="text" id="part-name" placeholder="Part name" required />
                    </div>
                    <div class="form-group">
                        <label>Part Number</label>
                        <input type="text" id="part-number-input" />
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="part-category">
                            <option value="Mechanical">Mechanical</option>
                            <option value="Electrical">Electrical</option>
                            <option value="Body">Body</option>
                            <option value="Interior">Interior</option>
                            <option value="Consumables">Consumables</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Quantity</label>
                        <input type="number" id="part-quantity" value="1" min="1" />
                    </div>
                    <div class="form-group">
                        <label>Price (each)</label>
                        <input type="number" id="part-price" placeholder="0.00" step="0.01" min="0" />
                    </div>
                    <div class="form-group full">
                        <label>Link</label>
                        <input type="url" id="part-url" placeholder="https://..." />
                    </div>
                    <div class="form-group full">
                        <label>Notes</label>
                        <textarea id="part-notes" rows="2" placeholder="Fitment notes, compatibility, status..."></textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-ghost">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Part</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ADD CAR MODAL -->
    <div class="modal-overlay" id="modal-add-car">
        <div class="modal">
            <h3>Add a Car</h3>
            <form id="form-add-car">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Year</label>
                        <input type="number" id="add-year" placeholder="2006" />
                    </div>
                    <div class="form-group">
                        <label>Make</label>
                        <input type="text" id="add-make" placeholder="BMW" />
                    </div>
                    <div class="form-group">
                        <label>Model</label>
                        <input type="text" id="add-model" placeholder="330ci" />
                    </div>
                    <div class="form-group">
                        <label>Trim</label>
                        <input type="text" id="add-trim" placeholder="M Sport" />
                    </div>
                    <div class="form-group full">
                        <label>Options</label>
                        <input type="text" id="add-options" placeholder="Competition, Premium Package" />
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-ghost">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Car</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <!-- PDF Viewer -->
    <div class="pdf-viewer-overlay" id="pdf-viewer-overlay" style="display:none">
        <div class="pdf-toolbar">
            <span class="pdf-title" id="pdf-title"></span>
            <button class="pdf-close-btn">Close</button>
        </div>
        <iframe id="pdf-frame" class="pdf-frame" src=""></iframe>
    </div>

    <!-- Prompt Dialog -->
    <div class="modal-overlay" id="prompt-overlay">
        <div class="modal confirm-modal">
            <h3 id="prompt-title">Add Pin</h3>
            <div class="prompt-fields">
                <div>
                    <label for="prompt-label-input" id="prompt-label-label">Component label</label>
                    <input type="text" id="prompt-label-input" />
                </div>
                <div id="prompt-notes-wrap">
                    <label for="prompt-notes-input">Notes <span style="font-weight:400">(optional)</span></label>
                    <input type="text" id="prompt-notes-input" />
                </div>
            </div>
            <div class="confirm-actions">
                <button class="btn btn-ghost">Cancel</button>
                <button class="btn btn-primary" id="prompt-ok-btn">Add Pin</button>
            </div>
        </div>
    </div>

    <!-- Confirm Dialog -->
    <div class="modal-overlay" id="confirm-overlay">
        <div class="modal confirm-modal">
            <p class="confirm-message" id="confirm-message"></p>
            <div class="confirm-actions">
                <button class="btn btn-ghost">Cancel</button>
                <button class="btn btn-danger" id="confirm-ok-btn">Delete</button>
            </div>
        </div>
    </div>

    <script type="module" src="/static/js/app.js"></script>

</body>

</html>
