services:
  pitcrew:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PITCREW_DB_PATH=/app/data/pitcrew.db
      - GENAI_API_KEY=${GENAI_API_KEY}
      - PITCREW_PIN_HASH=${PITCREW_PIN_HASH}
      - PITCREW_SECRET_KEY=${PITCREW_SECRET_KEY}
    volumes:
      - pitcrew-data:/app/data
      - pitcrew-uploads:/app/static/uploads
    expose:
      - "8600"
    restart: unless-stopped

volumes:
  pitcrew-data:
  pitcrew-uploads:
